name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Fixture tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Core and app tests, debug build
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
